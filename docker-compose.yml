services:
  gallery:
    build: .
    image: vrc-gallery:latest
    container_name: vrc-gallery
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      PORT: 8787
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATA_DIR: /app/data
      PHOTOS_DIR: /app/photos
      PHOTO_TZ_OFFSET: ${PHOTO_TZ_OFFSET:-+08:00}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      - ./photos:/app/photos
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
